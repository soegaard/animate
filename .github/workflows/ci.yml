name: animate

on:
  push:
  pull_request:

jobs:
  svg-preflight:
    name: SVG catalog preflight
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        racket: ["8.12", "9.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: Bogdanp/setup-racket@v1.11
        with:
          version: ${{ matrix.racket }}
      # Keep this independent of package installation: when a Racket catalog
      # resolves an obsolete svg release, the failure remains directly visible
      # instead of appearing later as an Animate dependency error.
      - run: |
          racket --version
          raco pkg catalog-show svg
          ./tools/ci-bootstrap-svg.sh

  core-minimum:
    name: Core / Racket ${{ matrix.racket }}
    runs-on: ubuntu-latest
    needs: svg-preflight
    strategy:
      fail-fast: false
      matrix:
        racket: ["8.12", "9.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: Bogdanp/setup-racket@v1.11
        with:
          version: ${{ matrix.racket }}
      - run: |
          pwd
          printf 'GITHUB_WORKSPACE=%s\n' "$GITHUB_WORKSPACE"
          ./tools/ci-bootstrap-svg.sh
          raco pkg install --auto --batch --name animate "$GITHUB_WORKSPACE"
          raco pkg show animate
      - run: raco make -l animate -l animate/3d -l animate/3d/render -l animate/authoring -l animate/preview -l animate/project -l animate/render
      - run: raco test tests/version-coherence-test.rkt tests/documentation-structure-test.rkt tests/documentation-public-tags-test.rkt tests/public-module-boundaries-test.rkt tests/example-public-imports-test.rkt tests/example-catalog-test.rkt tests/documented-bindings-exist-test.rkt

  current-headless:
    name: Full headless suite
    runs-on: ubuntu-latest
    needs: svg-preflight
    steps:
      - uses: actions/checkout@v4
      - uses: Bogdanp/setup-racket@v1.11
        with:
          version: "9.3"
      # The ordinary suite intentionally exercises formula construction and
      # project/media execution. `texlive-latex-extra` supplies the
      # `standalone` class used by tagged formulas (and pulls in the base
      # distribution); FFmpeg is required by the project fixtures.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends dvisvgm ffmpeg texlive-latex-extra
      - run: |
          pwd
          printf 'GITHUB_WORKSPACE=%s\n' "$GITHUB_WORKSPACE"
          ./tools/ci-bootstrap-svg.sh
          raco pkg install --auto --batch --name animate "$GITHUB_WORKSPACE"
          raco pkg show animate
      - run: raco test tests
      - run: raco test tests/scene-bq-br-test.rkt

  documentation-and-examples:
    name: Documentation and examples
    runs-on: ubuntu-latest
    needs: svg-preflight
    steps:
      - uses: actions/checkout@v4
      - uses: Bogdanp/setup-racket@v1.11
        with:
          version: "9.3"
      # Documentation setup and the non-OpenGL example gate instantiate
      # tagged formulas, so their TeX class dependencies must be present here
      # as well as in the formula/media lane.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends dvisvgm texlive-latex-extra
      - run: |
          pwd
          printf 'GITHUB_WORKSPACE=%s\n' "$GITHUB_WORKSPACE"
          ./tools/ci-bootstrap-svg.sh
          raco pkg install --auto --batch --name animate "$GITHUB_WORKSPACE"
          raco pkg show animate
      - run: raco setup --pkgs animate
      - run: racket tools/check-documentation.rkt "$RUNNER_TEMP/animate-documentation"
      - run: raco test tests/all-examples-compile-test.rkt

  release-check:
    name: Repository release check
    runs-on: ubuntu-latest
    needs: svg-preflight
    steps:
      - uses: actions/checkout@v4
      - uses: Bogdanp/setup-racket@v1.11
        with:
          version: "9.3"
      # Tagged formulas use `\\documentclass{standalone}`, which is packaged
      # in texlive-latex-extra rather than texlive-latex-base.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends dvisvgm ffmpeg texlive-latex-extra
      - run: |
          pwd
          printf 'GITHUB_WORKSPACE=%s\n' "$GITHUB_WORKSPACE"
          SOURCE_HOME="$RUNNER_TEMP/animate-source-home"
          mkdir -p "$SOURCE_HOME"
          env PLTUSERHOME="$SOURCE_HOME" ./tools/ci-bootstrap-svg.sh
          env PLTUSERHOME="$SOURCE_HOME" raco pkg install --auto --batch --name animate "$GITHUB_WORKSPACE"
          env PLTUSERHOME="$SOURCE_HOME" raco setup --pkgs animate
          env PLTUSERHOME="$SOURCE_HOME" raco pkg show animate
      - run: |
          SOURCE_HOME="$RUNNER_TEMP/animate-source-home"
          ARCHIVE_DIRECTORY="$RUNNER_TEMP/animate-package"
          mkdir -p "$ARCHIVE_DIRECTORY"
          env PLTUSERHOME="$SOURCE_HOME" raco animate check-source-tree "$ARCHIVE_DIRECTORY"
      - run: |
          SOURCE_HOME="$RUNNER_TEMP/animate-source-home"
          PACKAGE_HOME="$RUNNER_TEMP/animate-package-home"
          mkdir -p "$PACKAGE_HOME"
          env PLTUSERHOME="$SOURCE_HOME" raco animate check-installed-package "$RUNNER_TEMP/animate-package/animate.zip" "$PACKAGE_HOME"

  latex-and-media:
    name: Formula and media integration
    runs-on: ubuntu-latest
    needs: svg-preflight
    steps:
      - uses: actions/checkout@v4
      - uses: Bogdanp/setup-racket@v1.11
        with:
          version: "9.3"
      # Keep this lane aligned with the full-suite formula environment.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends dvisvgm ffmpeg texlive-latex-extra
      - run: |
          pwd
          printf 'GITHUB_WORKSPACE=%s\n' "$GITHUB_WORKSPACE"
          ./tools/ci-bootstrap-svg.sh
          raco pkg install --auto --batch --name animate "$GITHUB_WORKSPACE"
          raco pkg show animate
      - run: raco test tests/scene-ej-token-formula-test.rkt tests/scene-ek-match-plan-test.rkt tests/scene-dg-test.rkt

  gui-smoke:
    name: GRacket preview smoke
    runs-on: ubuntu-latest
    needs: svg-preflight
    steps:
      - uses: actions/checkout@v4
      - uses: Bogdanp/setup-racket@v1.11
        with:
          version: "9.3"
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: |
          pwd
          printf 'GITHUB_WORKSPACE=%s\n' "$GITHUB_WORKSPACE"
          ./tools/ci-bootstrap-svg.sh
          raco pkg install --auto --batch --name animate "$GITHUB_WORKSPACE"
          raco pkg show animate
      - run: xvfb-run -a gracket -l raco/main -- test tests/scene-ep-gui-smoke-test.rkt

  opengl-integration-ubuntu:
    name: OpenGL integration / Ubuntu Mesa
    runs-on: ubuntu-latest
    needs: svg-preflight
    steps:
      - uses: actions/checkout@v4
      - uses: Bogdanp/setup-racket@v1.11
        with:
          version: "9.3"
      - run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri mesa-utils
      - run: |
          pwd
          printf 'GITHUB_WORKSPACE=%s\n' "$GITHUB_WORKSPACE"
          ./tools/ci-bootstrap-svg.sh
          raco pkg install --auto --batch --name animate "$GITHUB_WORKSPACE"
          raco pkg show animate
      - run: >-
          mkdir -p "$RUNNER_TEMP/animate-opengl-conformance" && xvfb-run -a env ANIMATE_OPENGL_INTEGRATION=1 ANIMATE_OPENGL_INTEGRATION_REQUIRED=1 ANIMATE_OPENGL_CONFORMANCE_ARTIFACTS="$RUNNER_TEMP/animate-opengl-conformance" gracket -l raco/main -- test
          tests/scene-3d-p-opengl-integration-test.rkt
          tests/scene-3d-p-opengl-project-integration-test.rkt
          tests/scene-3d-v-capabilities-test.rkt
          tests/scene-3d-v-light-limit-integration-test.rkt
          tests/scene-3d-v-material-test.rkt
          tests/scene-3d-v-opengl-lighting-test.rkt
          tests/scene-3d-v-opengl-shadows-test.rkt
          tests/scene-3d-v-output-semantics-test.rkt
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: opengl-conformance-ubuntu
          path: ${{ runner.temp }}/animate-opengl-conformance
          if-no-files-found: ignore

  opengl-integration-macos:
    name: OpenGL integration / macOS
    runs-on: macos-latest
    needs: svg-preflight
    steps:
      - uses: actions/checkout@v4
      - uses: Bogdanp/setup-racket@v1.11
        with:
          version: "9.3"
      - run: |
          pwd
          printf 'GITHUB_WORKSPACE=%s\n' "$GITHUB_WORKSPACE"
          ./tools/ci-bootstrap-svg.sh
          raco pkg install --auto --batch --name animate "$GITHUB_WORKSPACE"
          raco pkg show animate
      - run: >-
          RACKET="$(command -v racket)" && GRACKET="$(dirname "$RACKET")/gracket" && test -x "$GRACKET" && mkdir -p "$RUNNER_TEMP/animate-opengl-conformance" &&
          env ANIMATE_OPENGL_INTEGRATION=1 ANIMATE_OPENGL_INTEGRATION_REQUIRED=1 ANIMATE_OPENGL_CONFORMANCE_ARTIFACTS="$RUNNER_TEMP/animate-opengl-conformance" "$GRACKET" -l raco/main -- test
          tests/scene-3d-p-opengl-integration-test.rkt
          tests/scene-3d-p-opengl-project-integration-test.rkt
          tests/scene-3d-v-capabilities-test.rkt
          tests/scene-3d-v-light-limit-integration-test.rkt
          tests/scene-3d-v-material-test.rkt
          tests/scene-3d-v-opengl-lighting-test.rkt
          tests/scene-3d-v-opengl-shadows-test.rkt
          tests/scene-3d-v-output-semantics-test.rkt
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: opengl-conformance-macos
          path: ${{ runner.temp }}/animate-opengl-conformance
          if-no-files-found: ignore
